name: CyberpunkAssetReceiver
options:
  deploymentTarget:
    visionOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: MSMQA9HS3H
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  CyberpunkAssetReceiver:
    type: application
    platform: visionOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.games.cyberpunk.assetreceiver
    info:
      path: ../../scratch/cyberpunk-resumable/Info.plist
      properties:
        NSLocalNetworkUsageDescription: Download and verify game asset chunks from your Mac on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
