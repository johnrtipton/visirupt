limit_req_zone $binary_remote_addr zone=visirupt_polls:1m rate=30r/m;
server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    if ($host = www.visirupt.com) { return 308 https://visirupt.com$request_uri; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ {
        limit_req zone=visirupt_polls burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 256;
        proxy_pass http://visirupt-polls:8081;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        access_log off;
    }
    location / { try_files $uri $uri/ =404; }
}
