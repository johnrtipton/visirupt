apiVersion: apps/v1
kind: Deployment
metadata:
  name: visirupt-web
  namespace: visirupt
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: visirupt-web
  template:
    metadata:
      labels:
        app: visirupt-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: site
          configMap:
            name: visirupt-site
        - name: nginx-config
          configMap:
            name: visirupt-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: visirupt-web
  namespace: visirupt
spec:
  selector:
    app: visirupt-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: visirupt-web
  namespace: visirupt
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [visirupt.com]
      secretName: visirupt-tls
  rules:
    - host: visirupt.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: visirupt-web
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: visirupt-www-redirect
  namespace: visirupt
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: https://visirupt.com$request_uri
    nginx.ingress.kubernetes.io/permanent-redirect-code: "308"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [www.visirupt.com]
      secretName: visirupt-www-tls
  rules:
    - host: www.visirupt.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: visirupt-web
                port:
                  name: http
