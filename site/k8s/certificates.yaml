apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: visirupt-tls
  namespace: visirupt
spec:
  secretName: visirupt-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames: [visirupt.com]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: visirupt-www-tls
  namespace: visirupt
spec:
  secretName: visirupt-www-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames: [www.visirupt.com]
