apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: visirupt-polls-data
  namespace: visirupt
spec:
  storageClassName: openebs-hostpath
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visirupt-polls
  namespace: visirupt
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: visirupt-polls
  template:
    metadata:
      labels:
        app: visirupt-polls
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: polls
          image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          command: [python, -B, /app/server.py]
          env:
            - name: POLL_DB
              value: /data/polls.sqlite3
            - name: POLL_ORIGIN
              value: https://visirupt.com
          ports:
            - name: http
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: source
          configMap:
            name: visirupt-polls-source
        - name: data
          persistentVolumeClaim:
            claimName: visirupt-polls-data
---
apiVersion: v1
kind: Service
metadata:
  name: visirupt-polls
  namespace: visirupt
spec:
  selector:
    app: visirupt-polls
  ports:
    - name: http
      port: 8081
      targetPort: http
