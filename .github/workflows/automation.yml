name: Automation source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  automation:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: make automation-test
  receiver:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: make -C cyberpunk-avp/resumable test lease-test
      - run: python3 -m unittest discover -s cyberpunk-avp/resumable/Tests -p test_background_transfer.py -v
